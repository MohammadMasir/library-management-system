<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LMS - Update product</title>
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    >
</head>
<body>
    <div style="justify-content: center; justify-self: center; margin-top: 20px;">
    <h1 style="text-align: center; color: green; padding: 10px; border: 1px solid black; border-bottom: transparent; background-color: yellowgreen; border-radius: 10px">
        Update Book Details
    </h1>
    <form action="" method="post" style="border: 1px solid gray; padding: 10px; border-radius: 10px; border-top: transparent;">
        <div style="display: grid; align-content: flex-start; grid-template-columns: auto 1fr; column-gap: 10px; align-items: center;">
            <label for="id">Id : </label>
            <input type="text" name="id" id="id" style="margin-bottom: 10px">

            <label for="title">Title : </label>
            <input type="text" name="title" id="title" style="margin-bottom: 10px">

            <label for="author">Author : </label>
            <input type="text" name="author" id="author" style="margin-bottom: 10px">

            <label for="description">Description : </label>
            <input type="text" name="description" id="description" style="margin-bottom: 10px">
        </div>
        <div style="display: flex; justify-content: center;">
            <button type="submit" onmouseover="this.style.background='darkolivegreen'; this.style.color='yellowgreen'" onmouseout="this.style.background='yellowgreen'; this.style.color='green'" style="color: green; background: yellowgreen; border: black; font-size: large; margin-top: 10px">
                Update
            </button>
        </div>
    </form>
</div>
</body>
</html>
