
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>LMS - Add product</title>

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>

<body>

<div style="display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: start;
            margin-top: 20px;">

    <!-- Left navigation icon -->
    <div style="padding-top: 10px;">
        <a style="margin-left: 25px;
                  padding: 5px 10px;"
           role="button"
           class="secondary"
           href="/">
<!--            ☰-->
<!--            &#8962;-->
            🏠
        </a>
    </div>

    <!-- Centered title + form -->
    <div>

        <h1 style="text-align: center;
                   color: green;
                   padding: 10px;
                   border: 1px solid black;
                   border-bottom: transparent;
                   background-color: yellowgreen;
                   border-radius: 10px">
            Add Book Details
        </h1>

        <form th:action="@{/books/add}"
              method="post"
              style="border: 1px solid gray;
                     padding: 10px;
                     border-radius: 10px;
                     border-top: transparent;">

            <div style="display: grid;
                        align-content: flex-start;
                        grid-template-columns: auto 1fr;
                        column-gap: 10px;
                        align-items: center;">

                <label for="title">Title : </label>
                <input type="text"
                       name="title"
                       id="title"
                       style="margin-bottom: 10px">

                <label for="authorName">Author : </label>
                <input type="text"
                       name="authorName"
                       id="authorName"
                       style="margin-bottom: 10px">

                <label for="description">Description : </label>
                <input type="text"
                       name="description"
                       id="description"
                       style="margin-bottom: 10px">
            </div>
            <p th:if="${addError}"><span th:text="${addError}"></span></p>

            <div style="display: flex; justify-content: center;">
                <button type="submit"
                        onmouseover="this.style.background='darkolivegreen'; this.style.color='yellowgreen'"
                        onmouseout="this.style.background='yellowgreen'; this.style.color='green'"
                        style="color: green;
                               background: yellowgreen;
                               border: black;
                               font-size: large;
                               margin-top: 10px">
                    Add
                </button>
            </div>

        </form>

    </div>

    <!-- Empty right column keeps center column truly centered -->
    <div></div>

</div>

</body>
</html>
