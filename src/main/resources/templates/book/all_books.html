<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>LMS - All Books</title>
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    >
</head>
<body>
    <div>
        <div style="padding: 10px; display: flex; align-items: center; justify-content: center; width: 100%;">
            <!-- Link at the far left with a 15px margin -->
            <a style="margin-right: auto; margin-left: 15px; padding: 5px 10px;" role="button" class="secondary" href="/">
                🏠
            </a>

            <!-- Centered heading (Note: changed from h2 to h1 as requested) -->
            <h1 style="color: green; margin: 10px; padding: 10px; border: 1px solid black; background-color: yellowgreen; border-radius: 10px">Book List</h1>

            <!-- Invisible spacer balancing the flex layout to keep h1 perfectly centered -->
            <div style="margin-left: auto; visibility: hidden; pointer-events: none; padding: 5px 10px; margin-right: 15px;"></div>
        </div>
        <article th:each="book : ${books}">
            <h4 style="margin: 5px">Book ID : <span th:text="${book.id()}"></span></h4><br>
            <h2>Title : <span th:text="${book.title()}"></span></h2><br>
            <h3>Author : <span th:text="${book.authorName()}"></span></h3><br>
            <h3>Description : <span th:text="${book.description()}"></span></h3>
        </article>
    </div>
</body>
</html>
